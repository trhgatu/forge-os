services:
  postgres:
    image: postgres:16
    container_name: forge-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: forge_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forge-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    image: node:20-alpine
    container_name: forge-api-dev
    working_dir: /app
    volumes:
      - .:/app:delegated
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/eslint-config/node_modules
      - /app/packages/typescript-config/node_modules
    command: sh -c "corepack enable pnpm && pnpm install && cd apps/api && npx prisma generate && npx nodemon --watch src -e ts --exec 'node -r ts-node/register -r tsconfig-paths/register src/main.ts' -L"
    ports:
      - "3005:3005"
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/forge_os?schema=public
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  # --- Frontend Application (Optional Dev Container) ---
  # web:
  #   image: node:20-alpine
  #   container_name: forge-web-dev
  #   working_dir: /app
  #   volumes:
  #     - .:/app
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - apps/web/.env
  #   depends_on:
  #     - api

volumes:
  postgres_data:
  redis_data:
